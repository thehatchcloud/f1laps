# Builds the production image, pushes it to GitHub Container Registry and
# deploys it to the server over SSH with Docker Compose.
#
# Required repository secrets:
#   DEPLOY_HOST     server hostname or IP
#   DEPLOY_USER     SSH user (created by deploy/server-setup.sh, default "deploy")
#   DEPLOY_SSH_KEY  private key whose public half is in that user's authorized_keys
# Optional:
#   DEPLOY_PORT     SSH port (default 22)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  APP_DIR: /opt/f1laps

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        name: Image name
        run: |
          name="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "image=${name}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${name}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOC
          Host server
            HostName $HOST
            Port $PORT
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
          EOC

      - name: Copy compose files
        run: |
          ssh server "mkdir -p $APP_DIR"
          scp deploy/docker-compose.yml deploy/Caddyfile server:$APP_DIR/

      - name: Pull image and restart
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh server "set -e
            cd $APP_DIR
            [ -f .env ] || cp /dev/null .env
            echo \"$GHCR_TOKEN\" | docker login $REGISTRY -u \"$GHCR_USER\" --password-stdin
            F1LAPS_IMAGE=$IMAGE docker compose pull app
            F1LAPS_IMAGE=$IMAGE docker compose up -d --remove-orphans
            docker logout $REGISTRY
            docker image prune -f >/dev/null
          "

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            status=$(ssh server "cd $APP_DIR && docker inspect -f '{{.State.Health.Status}}' \$(docker compose ps -q app)" 2>/dev/null || true)
            echo "app: ${status:-starting}"
            [ "$status" = "healthy" ] && exit 0
            sleep 4
          done
          echo "app did not become healthy"
          ssh server "cd $APP_DIR && docker compose logs --tail=100 app"
          exit 1
